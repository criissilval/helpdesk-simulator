spring.application.name=helpdesk

# ================================
# BANCO DE DADOS PostgreSQL
# ================================

# URL de conexão: localhost na porta padrão, banco "helpdesk"
spring.datasource.url=jdbc:postgresql://localhost:5432/helpdesk

# Driver do PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Usuário e senha — no Mac via Homebrew, o usuário é o seu login do Mac, sem senha
spring.datasource.username=${USER}
spring.datasource.password=

# ================================
# JPA / HIBERNATE
# ================================

# update: cria/atualiza as tabelas sem destruir dados existentes
# Em produção futura, trocar por "validate" + Flyway ou Liquibase
spring.jpa.hibernate.ddl-auto=update

# Exibe no terminal o SQL que o Hibernate está executando
spring.jpa.show-sql=true

# Formata o SQL exibido para ficar legível
spring.jpa.properties.hibernate.format_sql=true

# Dialeto: removido pois o Hibernate detecta automaticamente no PostgreSQL 15+
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Desabilita o open-in-view para evitar queries desnecessárias durante a renderização
spring.jpa.open-in-view=false
